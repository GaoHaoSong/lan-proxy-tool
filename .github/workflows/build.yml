name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path ./ProxyTool.exe)) { throw "ProxyTool.exe not found" }
          Get-Item ./ProxyTool.exe | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyTool
          path: |
            ProxyTool.exe
            app.ico
          if-no-files-found: error